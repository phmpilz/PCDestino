name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate project
        run: npm run validate
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore backend
        run: dotnet restore backend/PCDestino.Backend.sln
      - name: Build backend
        run: dotnet build backend/PCDestino.Backend.sln --configuration Release --no-restore
      - name: Test backend
        run: dotnet test backend/PCDestino.Backend.sln --configuration Release --no-build --logger "trx;LogFileName=backend-tests.trx"
