name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate project
        run: npm run validate
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore backend
        run: dotnet restore backend/PCDestino.Backend.sln
      - name: Build backend
        run: dotnet build backend/PCDestino.Backend.sln --configuration Release --no-restore
      - name: Test backend
        run: dotnet test backend/PCDestino.Backend.sln --configuration Release --no-build --logger "trx;LogFileName=backend-tests.trx"
